    .youtube { background: #232622; }
    .film { position: absolute; inset: 0; z-index: -2; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .film img { width: 100%; height: 108px; object-fit: cover; object-position: 50% 45%; filter: saturate(.65); }
    .youtube::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg,#111b19dc,#111b193b); }
    .youtube .title { font-size: 22px; letter-spacing: -.8px; }
    .play { width: 26px; height: 26px; border: 1px solid #fff8; border-radius: 50%; display: grid; place-items: center; margin-bottom: 2px; }
    .play::before { content: ''; margin-left: 2px; border-left: 6px solid #fff; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
    .youtube .copy { gap: 5px; }
    footer { margin-top: 28px; text-align: center; font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; opacity: .6; }
